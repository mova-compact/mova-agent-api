[package]
name = "mova-agent-api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
cloudflare_worker = ["dep:worker"]

[dependencies]
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros"] }
tower = "0.5"
worker = { version = "0.8.3", features = ["http", "axum"], optional = true }
