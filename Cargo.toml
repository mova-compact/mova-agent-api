[package]
name = "mova-agent-api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["native"]
native = []
cloudflare_worker = ["dep:worker"]
worker = ["cloudflare_worker"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
worker = { version = "0.7.5", features = ["http"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.7"
tower = "0.5"
tokio = { version = "1.39", default-features = false, features = ["rt", "macros"] }

[dev-dependencies]
tokio = { version = "1.39", default-features = false, features = ["rt-multi-thread", "macros"] }
