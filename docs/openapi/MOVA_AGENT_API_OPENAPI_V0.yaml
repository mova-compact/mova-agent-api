openapi: 3.0.3
info:
  title: MOVA Agent API V0
  version: 0.1.0
  description: >
    Product-local API surface for controlled agent actions in MOVA Agent API V0.
servers:
  - url: https://api.mova-agent.local
paths:
  /health:
    get:
      summary: Liveness health check
      operationId: getHealth
      responses:
        "200":
          description: Service is alive
  /ready:
    get:
      summary: Readiness check for runtime dependencies
      operationId: getReady
      responses:
        "200":
          description: Service is ready
  /capabilities:
    get:
      summary: Get supported capabilities
      operationId: getCapabilities
      responses:
        "200":
          description: Capability surface
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - action_types
                  - policy_decisions
                  - execution_path
                  - runtime_provider
                properties:
                  action_types:
                    type: array
                    items:
                      type: string
                  policy_decisions:
                    type: array
                    items:
                      type: string
                  execution_path:
                    type: array
                    items:
                      type: string
                    minItems: 7
                  runtime_provider:
                    $ref: "#/components/schemas/RuntimeProviderCapabilities"
  /actions/validate:
    post:
      summary: Validate action request envelope without execution
      operationId: validateAction
      parameters:
        - name: x-mova-auth-mode
          in: header
          required: false
          schema:
            type: string
            enum:
              - placeholder
              - production
              - offline_provider_stub
          description: Optional placeholder auth mode metadata forwarded to policy input.
          example: production
        - name: x-mova-actor-id
          in: header
          required: false
          schema:
            type: string
          description: Optional actor identifier metadata forwarded to policy input.
        - name: x-mova-token-ref
          in: header
          required: false
          schema:
            type: string
          description: Optional token reference metadata. Production mode uses deterministic contract `token://<issuer>/<subject>?aud=<audience>`.
          example: token://mova-trusted/agent_001?aud=mova-agent-api
        - name: x-mova-scopes
          in: header
          required: false
          schema:
            type: string
          description: Optional comma-separated scope hints forwarded to policy input.
          example: actions.run,actions.validate
        - name: x-mova-auth-source
          in: header
          required: false
          schema:
            type: string
          description: Optional auth metadata source tag, for example `header`.
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: Optional idempotency key for replay-safe run submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEnvelope"
            examples:
              universalHttpWebhook:
                summary: Universal HTTP connector request using endpoint_ref allowlist
                value:
                  request_id: req_http_generic_01
                  actor:
                    actor_type: ai_agent
                    actor_id: agent_001
                  source:
                    channel: api
                    client_id: client_001
                  auth_context:
                    mode: placeholder
                    scopes: [actions.run]
                    source: example
                    verified: false
                  action:
                    action_id: act_http_generic_01
                    action_type: webhook_notify
                    target_kind: webhook
                    input_payload:
                      message: mova http generic smoke
                    policy_context:
                      policy_profile_ref: policy.default.v0
                    connector_context:
                      connector_set: [connector.http.generic.v1]
                      connector_id: connector.http.generic.v1
                      side_effect_intent: external_network
                      endpoint_ref: webhook_site_test
                      method: POST
                      headers:
                        x-mova-contract: operator_terminal_smoke_v0
                    trace_ref: trace:req_http_generic_01
                  inputs:
                    message: mova http generic smoke
                  context:
                    tenant_id: tenant_001
                  correlation:
                    trace_id: trace_http_generic_01
                    correlation_id: corr_http_generic_01
                  timestamps:
                    requested_at: "2026-05-23T08:30:00Z"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /actions/run:
    post:
      summary: Run a single admitted action via flat path
      operationId: runAction
      parameters:
        - name: x-mova-auth-mode
          in: header
          required: false
          schema:
            type: string
            enum:
              - placeholder
              - production
              - offline_provider_stub
          description: Optional placeholder auth mode metadata forwarded to policy input.
          example: production
        - name: x-mova-actor-id
          in: header
          required: false
          schema:
            type: string
          description: Optional actor identifier metadata forwarded to policy input.
        - name: x-mova-token-ref
          in: header
          required: false
          schema:
            type: string
          description: Optional token reference metadata. Production mode uses deterministic contract `token://<issuer>/<subject>?aud=<audience>`.
          example: token://mova-trusted/agent_001?aud=mova-agent-api
        - name: x-mova-scopes
          in: header
          required: false
          schema:
            type: string
          description: Optional comma-separated scope hints forwarded to policy input.
          example: actions.run,actions.validate
        - name: x-mova-auth-source
          in: header
          required: false
          schema:
            type: string
          description: Optional auth metadata source tag, for example `header`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEnvelope"
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - run_id
                  - status
                  - trace_ref
                  - observation_count
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
                  trace_ref:
                    type: string
                  observation_count:
                    type: integer
                    minimum: 0
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authorization failure or connector guard denial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Connector execution failure or runtime secret resolution failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Connector timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage adapter unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /runs/{run_id}:
    get:
      summary: Get run status and summary
      operationId: getRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run shape
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - run_id
                  - status
                  - trace_ref
                  - observation_count
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
                  trace_ref:
                    type: string
                  observation_count:
                    type: integer
                    minimum: 0
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage adapter unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /runs/{run_id}/evidence:
    get:
      summary: Get run evidence response
      operationId: getRunEvidence
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evidence response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage adapter unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Action:
      type: object
      additionalProperties: false
      required:
        - action_id
        - action_type
        - target_kind
        - policy_context
        - connector_context
        - trace_ref
      properties:
        action_id:
          type: string
        action_type:
          type: string
        target_kind:
          type: string
        input_ref:
          type: string
        input_payload:
          type: object
        policy_context:
          type: object
        connector_context:
          type: object
        trace_ref:
          type: string
      oneOf:
        - required:
            - input_ref
        - required:
            - input_payload
    RequestEnvelope:
      type: object
      additionalProperties: false
      required:
        - request_id
        - actor
        - source
        - action
        - inputs
        - context
        - correlation
        - timestamps
      properties:
        request_id:
          type: string
        actor:
          type: object
          additionalProperties: false
          required:
            - actor_type
            - actor_id
          properties:
            actor_type:
              type: string
            actor_id:
              type: string
        source:
          type: object
          additionalProperties: false
          required:
            - channel
            - client_id
          properties:
            channel:
              type: string
            client_id:
              type: string
        auth_context:
          $ref: "#/components/schemas/AuthContext"
        action:
          $ref: "#/components/schemas/Action"
        inputs:
          type: object
        context:
          type: object
        correlation:
          type: object
        timestamps:
          type: object
    PolicySummary:
      type: object
      additionalProperties: false
      required:
        - decision
        - policy_version
        - reason_code
      properties:
        decision:
          type: string
          enum:
            - allow
            - deny
            - require_review
            - redact
        policy_version:
          type: string
        reason_code:
          type: string
    AuthContext:
      type: object
      additionalProperties: false
      required:
        - mode
        - scopes
        - verified
      properties:
        mode:
          type: string
        actor_id:
          type: string
        token_ref:
          type: string
        scopes:
          type: array
          items:
            type: string
        source:
          type: string
        verified:
          type: boolean
          enum:
            - false
    EvidenceResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - status
        - result
        - evidence
        - trace_ref
        - observation_refs
        - policy_summary
      properties:
        run_id:
          type: string
        status:
          type: string
          enum:
            - accepted
            - in_progress
            - completed
            - failed
            - blocked
        result:
          type: object
        evidence:
          type: object
        trace_ref:
          type: string
        observation_refs:
          type: array
          items:
            type: string
        policy_summary:
          $ref: "#/components/schemas/PolicySummary"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    RuntimeProviderCapabilities:
      type: object
      additionalProperties: false
      required:
        - provider_kind
        - supports_env_loading
        - supports_secret_resolution
        - supports_live_deploy_binding
      properties:
        provider_kind:
          type: string
        supports_env_loading:
          type: boolean
        supports_secret_resolution:
          type: boolean
        supports_live_deploy_binding:
          type: boolean
