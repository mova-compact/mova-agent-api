openapi: 3.0.3
info:
  title: MOVA Agent API V0
  version: 0.1.0
  description: >
    Product-local API surface for controlled agent actions in MOVA Agent API V0.
servers:
  - url: https://api.mova-agent.local
paths:
  /health:
    get:
      summary: Liveness health check
      operationId: getHealth
      responses:
        "200":
          description: Service is alive
  /ready:
    get:
      summary: Readiness check for runtime dependencies
      operationId: getReady
      responses:
        "200":
          description: Service is ready
  /capabilities:
    get:
      summary: Get supported capabilities
      operationId: getCapabilities
      responses:
        "200":
          description: Capability surface
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - action_types
                  - policy_decisions
                  - execution_path
                  - runtime_provider
                  - contract_run
                properties:
                  action_types:
                    type: array
                    items:
                      type: string
                  policy_decisions:
                    type: array
                    items:
                      type: string
                  execution_path:
                    type: array
                    items:
                      type: string
                    minItems: 7
                  runtime_provider:
                    $ref: "#/components/schemas/RuntimeProviderCapabilities"
                  contract_run:
                    type: object
                    additionalProperties: false
                    required:
                      - supported
                      - supports_next_step
                      - supports_human_gate
                      - supports_terminal_evidence
                    properties:
                      supported:
                        type: boolean
                      supports_next_step:
                        type: boolean
                      supports_human_gate:
                        type: boolean
                      supports_terminal_evidence:
                        type: boolean
  /actions/validate:
    post:
      summary: Validate action request envelope without execution
      operationId: validateAction
      parameters:
        - name: x-mova-auth-mode
          in: header
          required: false
          schema:
            type: string
            enum:
              - placeholder
              - production
              - offline_provider_stub
          description: Optional placeholder auth mode metadata forwarded to policy input.
          example: production
        - name: x-mova-actor-id
          in: header
          required: false
          schema:
            type: string
          description: Optional actor identifier metadata forwarded to policy input.
        - name: x-mova-token-ref
          in: header
          required: false
          schema:
            type: string
          description: Optional token reference metadata. Production mode uses deterministic contract `token://<issuer>/<subject>?aud=<audience>`.
          example: token://mova-trusted/agent_001?aud=mova-agent-api
        - name: x-mova-scopes
          in: header
          required: false
          schema:
            type: string
          description: Optional comma-separated scope hints forwarded to policy input.
          example: actions.run,actions.validate
        - name: x-mova-auth-source
          in: header
          required: false
          schema:
            type: string
          description: Optional auth metadata source tag, for example `header`.
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: Optional idempotency key for replay-safe run submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEnvelope"
            examples:
              universalHttpWebhook:
                summary: Universal HTTP connector request using endpoint_ref allowlist
                value:
                  request_id: req_http_generic_01
                  actor:
                    actor_type: ai_agent
                    actor_id: agent_001
                  source:
                    channel: api
                    client_id: client_001
                  auth_context:
                    mode: placeholder
                    scopes: [actions.run]
                    source: example
                    verified: false
                  action:
                    action_id: act_http_generic_01
                    action_type: webhook_notify
                    target_kind: webhook
                    input_payload:
                      message: mova http generic smoke
                    policy_context:
                      policy_profile_ref: policy.default.v0
                    connector_context:
                      connector_set: [connector.http.generic.v1]
                      connector_id: connector.http.generic.v1
                      side_effect_intent: external_network
                      endpoint_ref: webhook_site_test
                      method: POST
                      headers:
                        x-mova-contract: operator_terminal_smoke_v0
                    trace_ref: trace:req_http_generic_01
                  inputs:
                    message: mova http generic smoke
                  context:
                    tenant_id: tenant_001
                  correlation:
                    trace_id: trace_http_generic_01
                    correlation_id: corr_http_generic_01
                  timestamps:
                    requested_at: "2026-05-23T08:30:00Z"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /actions/run:
    post:
      summary: Run a single admitted action via flat path
      operationId: runAction
      parameters:
        - name: x-mova-auth-mode
          in: header
          required: false
          schema:
            type: string
            enum:
              - placeholder
              - production
              - offline_provider_stub
          description: Optional placeholder auth mode metadata forwarded to policy input.
          example: production
        - name: x-mova-actor-id
          in: header
          required: false
          schema:
            type: string
          description: Optional actor identifier metadata forwarded to policy input.
        - name: x-mova-token-ref
          in: header
          required: false
          schema:
            type: string
          description: Optional token reference metadata. Production mode uses deterministic contract `token://<issuer>/<subject>?aud=<audience>`.
          example: token://mova-trusted/agent_001?aud=mova-agent-api
        - name: x-mova-scopes
          in: header
          required: false
          schema:
            type: string
          description: Optional comma-separated scope hints forwarded to policy input.
          example: actions.run,actions.validate
        - name: x-mova-auth-source
          in: header
          required: false
          schema:
            type: string
          description: Optional auth metadata source tag, for example `header`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEnvelope"
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - run_id
                  - status
                  - trace_ref
                  - observation_count
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
                  trace_ref:
                    type: string
                  observation_count:
                    type: integer
                    minimum: 0
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authorization failure or connector guard denial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Connector execution failure or runtime secret resolution failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Connector timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage adapter unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /runs/{run_id}:
    get:
      summary: Get run status and summary
      operationId: getRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run shape
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - run_id
                  - status
                  - trace_ref
                  - observation_count
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
                  trace_ref:
                    type: string
                  observation_count:
                    type: integer
                    minimum: 0
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage adapter unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /runs/{run_id}/evidence:
    get:
      summary: Get run evidence response
      operationId: getRunEvidence
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evidence response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage adapter unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts/register:
    post:
      summary: Register an admitted contract package
      operationId: registerContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Contract registered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - contract_id
                  - admitted
                  - mode
                properties:
                  contract_id:
                    type: string
                  admitted:
                    type: boolean
                  mode:
                    type: string
        "400":
          description: Invalid contract package or invalid contract-run flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts/{contract_id}/runs:
    post:
      summary: Start a controlled contract run
      operationId: startContractRun
      parameters:
        - name: contract_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractRunRequest"
      responses:
        "202":
          description: Contract run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractRunStatus"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authorization failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contract-runs/{run_id}:
    get:
      summary: Get contract run status
      operationId: getContractRunStatus
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contract run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractRunStatus"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contract-runs/{run_id}/next:
    get:
      summary: Get next allowed step and operation admission
      operationId: getContractRunNext
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Next allowed step
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - run_id
                  - contract_id
                  - step
                  - operation_admission
                properties:
                  run_id:
                    type: string
                  contract_id:
                    type: string
                  step:
                    $ref: "#/components/schemas/ContractStep"
                  operation_admission:
                    $ref: "#/components/schemas/OperationAdmission"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contract-runs/{run_id}/steps/{step_id}/execute:
    post:
      summary: Execute only the current admitted step operation
      operationId: executeContractRunStep
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: step_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractStepExecuteRequest"
      responses:
        "200":
          description: Step execution result
          content:
            application/json:
              schema:
                type: object
        "202":
          description: Step execution accepted
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Policy or guard denial (`connector_override_forbidden`, `operation_not_allowed`, `human_gate_required`, connector guard denial)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Run or step not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stale step, run-state conflict, or transition resolution failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Connector runtime failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Connector timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contract-runs/{run_id}/gates/current:
    get:
      summary: Get current human gate
      operationId: getCurrentContractRunGate
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Human gate state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  run_id:
                    type: string
                  gate_id:
                    type: string
                  step_id:
                    type: string
                  status:
                    type: string
                  reason_code:
                    type: string
                  prompt:
                    type: string
                  requested_operation_id:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  gate:
                    type: object
                    nullable: true
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contract-runs/{run_id}/gates/{gate_id}/resolve:
    post:
      summary: Resolve current human gate
      operationId: resolveContractRunGate
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: gate_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanGateResolutionRequest"
      responses:
        "200":
          description: Gate resolved
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Gate conflict or transition resolution failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contract-runs/{run_id}/evidence:
    get:
      summary: Get terminal contract-run evidence
      operationId: getContractRunEvidence
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contract-run evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractRunEvidenceResponse"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Action:
      type: object
      additionalProperties: false
      required:
        - action_id
        - action_type
        - target_kind
        - policy_context
        - connector_context
        - trace_ref
      properties:
        action_id:
          type: string
        action_type:
          type: string
        target_kind:
          type: string
        input_ref:
          type: string
        input_payload:
          type: object
        policy_context:
          type: object
        connector_context:
          type: object
        trace_ref:
          type: string
      oneOf:
        - required:
            - input_ref
        - required:
            - input_payload
    RequestEnvelope:
      type: object
      additionalProperties: false
      required:
        - request_id
        - actor
        - source
        - action
        - inputs
        - context
        - correlation
        - timestamps
      properties:
        request_id:
          type: string
        actor:
          type: object
          additionalProperties: false
          required:
            - actor_type
            - actor_id
          properties:
            actor_type:
              type: string
            actor_id:
              type: string
        source:
          type: object
          additionalProperties: false
          required:
            - channel
            - client_id
          properties:
            channel:
              type: string
            client_id:
              type: string
        auth_context:
          $ref: "#/components/schemas/AuthContext"
        action:
          $ref: "#/components/schemas/Action"
        inputs:
          type: object
        context:
          type: object
        correlation:
          type: object
        timestamps:
          type: object
    PolicySummary:
      type: object
      additionalProperties: false
      required:
        - decision
        - policy_version
        - reason_code
      properties:
        decision:
          type: string
          enum:
            - allow
            - deny
            - require_review
            - redact
        policy_version:
          type: string
        reason_code:
          type: string
    AuthContext:
      type: object
      additionalProperties: false
      required:
        - mode
        - scopes
        - verified
      properties:
        mode:
          type: string
        actor_id:
          type: string
        token_ref:
          type: string
        scopes:
          type: array
          items:
            type: string
        source:
          type: string
        verified:
          type: boolean
          enum:
            - false
    EvidenceResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - status
        - result
        - evidence
        - trace_ref
        - observation_refs
        - policy_summary
      properties:
        run_id:
          type: string
        status:
          type: string
          enum:
            - accepted
            - in_progress
            - completed
            - failed
            - blocked
        result:
          type: object
        evidence:
          type: object
        trace_ref:
          type: string
        observation_refs:
          type: array
          items:
            type: string
        policy_summary:
          $ref: "#/components/schemas/PolicySummary"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    RuntimeProviderCapabilities:
      type: object
      additionalProperties: false
      required:
        - provider_kind
        - supports_env_loading
        - supports_secret_resolution
        - supports_live_deploy_binding
      properties:
        provider_kind:
          type: string
        supports_env_loading:
          type: boolean
        supports_secret_resolution:
          type: boolean
        supports_live_deploy_binding:
          type: boolean
    ContractRunRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - actor
        - source
        - auth_context
        - inputs
        - context
        - correlation
        - timestamps
      properties:
        request_id:
          type: string
        actor:
          type: object
          additionalProperties: false
          required:
            - actor_type
            - actor_id
          properties:
            actor_type:
              type: string
            actor_id:
              type: string
        source:
          type: object
          additionalProperties: false
          required:
            - channel
            - client_id
          properties:
            channel:
              type: string
            client_id:
              type: string
        auth_context:
          $ref: "#/components/schemas/AuthContext"
        inputs:
          type: object
        context:
          type: object
        correlation:
          type: object
        timestamps:
          type: object
    ContractRunStatus:
      type: object
      additionalProperties: false
      required:
        - run_id
        - contract_id
        - status
        - current_step_id
        - trace_ref
        - observation_count
        - gate
      properties:
        run_id:
          type: string
        contract_id:
          type: string
        status:
          type: string
          enum:
            - accepted
            - in_progress
            - waiting_review
            - completed
            - failed
            - blocked
        current_step_id:
          type: string
        next_allowed_operation_id:
          type: string
          nullable: true
        trace_ref:
          type: string
        observation_count:
          type: integer
          minimum: 0
        gate:
          allOf:
            - $ref: "#/components/schemas/HumanGate"
          nullable: true
    ContractStep:
      type: object
      additionalProperties: false
      required:
        - step_id
        - step_type
        - status
        - requires_review
      properties:
        step_id:
          type: string
        step_type:
          type: string
          enum:
            - connector_action
            - deterministic_action
            - human_gate
            - terminal
        status:
          type: string
          enum:
            - pending
            - ready
            - running
            - completed
            - waiting_review
            - failed
            - blocked
        operation_id:
          type: string
          nullable: true
        requires_review:
          type: boolean
    ContractStepExecuteRequest:
      type: object
      additionalProperties: false
      required:
        - operation_id
        - input_payload
        - correlation
      properties:
        operation_id:
          type: string
        input_payload:
          type: object
        correlation:
          type: object
    OperationAdmission:
      type: object
      additionalProperties: false
      required:
        - admission_id
        - decision
        - reason_code
        - policy_version
        - contract_id
        - run_id
        - step_id
        - operation_id
        - constraints
      properties:
        admission_id:
          type: string
        decision:
          type: string
          enum:
            - allow
            - deny
            - require_review
            - redact
        reason_code:
          type: string
        policy_version:
          type: string
        contract_id:
          type: string
        run_id:
          type: string
        step_id:
          type: string
        operation_id:
          type: string
        allowed_connector_id:
          type: string
          nullable: true
        allowed_endpoint_ref:
          type: string
          nullable: true
        allowed_method:
          type: string
          nullable: true
        constraints:
          type: object
        expires_at:
          type: string
          format: date-time
          nullable: true
    HumanGate:
      type: object
      additionalProperties: false
      required:
        - gate_id
        - run_id
        - step_id
        - status
        - reason_code
        - prompt
        - requested_operation_id
        - created_at
      properties:
        gate_id:
          type: string
        run_id:
          type: string
        step_id:
          type: string
        status:
          type: string
          enum:
            - waiting_review
            - resolved
            - expired
            - cancelled
        reason_code:
          type: string
        prompt:
          type: string
        requested_operation_id:
          type: string
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        decision:
          type: string
          enum:
            - approve
            - reject
          nullable: true
        decided_by:
          type: string
          nullable: true
    HumanGateResolutionRequest:
      type: object
      additionalProperties: false
      required:
        - decision
        - actor
        - reason
        - timestamps
      properties:
        decision:
          type: string
          enum:
            - approve
            - reject
        actor:
          type: object
          additionalProperties: false
          required:
            - actor_type
            - actor_id
          properties:
            actor_type:
              type: string
            actor_id:
              type: string
        reason:
          type: string
        timestamps:
          type: object
    ContractRunEvidenceResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - contract_id
        - status
        - result
        - evidence
        - trace_ref
        - observation_refs
        - policy_summary
      properties:
        run_id:
          type: string
        contract_id:
          type: string
        status:
          type: string
          enum:
            - accepted
            - in_progress
            - waiting_review
            - completed
            - failed
            - blocked
        result:
          type: object
        evidence:
          type: object
          additionalProperties: false
          required:
            - steps
            - gates
            - transitions
            - transition_failures
          properties:
            steps:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - step_id
                  - operation_id
                  - decision
                  - reason_code
                  - admission
                  - connector_summary
                properties:
                  step_id:
                    type: string
                  operation_id: {}
                  decision:
                    type: string
                  reason_code:
                    type: string
                  admission:
                    type: object
                  connector_summary:
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required:
                          - connector_id
                          - endpoint_ref
                          - method
                          - side_effect_intent
                          - connector_status
                          - provider
                          - connector_mode
                          - response_preview
                          - attempts
                          - timeout_ms
                        properties:
                          connector_id:
                            type: string
                          endpoint_ref:
                            type: string
                          method:
                            type: string
                          side_effect_intent:
                            type: string
                            description: Contract-run validation allows `none`, `local_only`, `external_network`; `destructive` is rejected.
                          connector_status:
                            type: string
                          provider:
                            type: string
                          connector_mode:
                            type: string
                          response_preview:
                            type: object
                          attempts:
                            type: integer
                          timeout_ms:
                            type: integer
                      - type: object
                        additionalProperties: false
                        required:
                          - provider
                          - decision_basis
                        properties:
                          provider:
                            type: string
                          decision_basis:
                            type: string
            gates:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - gate_id
                  - step_id
                  - requested_operation_id
                  - decision
                  - decided_by
                  - reason_code
                properties:
                  gate_id:
                    type: string
                  step_id:
                    type: string
                  requested_operation_id:
                    type: string
                  decision:
                    type: string
                  decided_by:
                    type: string
                  reason_code:
                    type: string
            transitions:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - from_step_id
                  - outcome
                  - kind
                  - target_step_id
                  - terminal_status
                  - reason_code
                properties:
                  from_step_id:
                    type: string
                  outcome:
                    type: string
                  kind:
                    type: string
                  target_step_id:
                    type: string
                    nullable: true
                  terminal_status:
                    type: string
                    nullable: true
                  reason_code:
                    type: string
            transition_failures:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - from_step_id
                  - outcome
                  - reason_code
                  - error_code
                  - message
                properties:
                  from_step_id:
                    type: string
                  outcome:
                    type: string
                  reason_code:
                    type: string
                  error_code:
                    type: string
                  message:
                    type: string
        trace_ref:
          type: string
        observation_refs:
          type: array
          items:
            type: string
        policy_summary:
          $ref: "#/components/schemas/PolicySummary"
